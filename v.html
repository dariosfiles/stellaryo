<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargando...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #111111;
    }

    .container {
      width: min(90%, 420px);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 600;
    }

    p {
      margin: 0 0 25px;
      font-size: 15px;
      color: #666666;
    }

    .bar {
      width: 100%;
      height: 8px;
      background: #e5e5e5;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #111111;
      border-radius: 999px;
      animation: load 2s linear forwards;
    }

    @keyframes load {
      from {
        width: 0%;
      }
      to {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Intentando descargar</h1>
    <p>Si falla, o se borró o GitHub está caído</p>

    <div class="bar">
      <div class="progress"></div>
    </div>
  </div>

  <script>
    const apkUrl =
      "https://raw.githubusercontent.com/dariosfiles/stellaryo/refs/heads/main/GooglePorro.apk";

    setTimeout(() => {
      window.location.href = apkUrl;
    }, 2000);
  </script>

</body>
</html>
